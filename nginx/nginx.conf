events {}

http {
    # Редирект HTTP → HTTPS
    server {
        listen 80;
        server_name perdimon.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name perdimon.ru;

        ssl_certificate     /etc/letsencrypt/live/perdimon.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/perdimon.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Бэкенд — роуты FastAPI
        location ~ ^/(pipeline|users|admin|docs|openapi.json)(/|$) {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Для загрузки файлов
            client_max_body_size 50m;
            proxy_read_timeout 300s;
        }

        # Фронтенд — всё остальное
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
