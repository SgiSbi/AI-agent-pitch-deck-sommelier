services:
  backend:
    restart: unless-stopped
    env_file: backend/.env.backend
    build:
      context: backend
      dockerfile: Dockerfile
    expose:
      - 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/tmp:/app/tmp

  frontend-web:
    restart: unless-stopped
    env_file: frontend/.env.frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend/users_whitelist.json:/app/users_whitelist.json

  telegram-bot:
    restart: unless-stopped
    env_file: frontend/.env.frontend
    build:
      context: frontend
      dockerfile: Dockerfile.bot
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend/users_whitelist.json:/app/users_whitelist.json