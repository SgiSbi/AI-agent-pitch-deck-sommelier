services:
  backend:
    restart: unless-stopped
    env_file: backend/.env.backend
    build:
      context: backend
      dockerfile: Dockerfile
    expose:
      - 8000
    ports:
      - "8000:8000"

frontend:
  restart: unless-stopped
  env_file: frontend/.env.frontend
  build:
    context: frontend
    dockerfile: Dockerfile
  depends_on:
    - backend
  volumes:
    - frontend_whitelist:users_whitelist.json  # или другой путь в контейнере

volumes:
  frontend_whitelist: