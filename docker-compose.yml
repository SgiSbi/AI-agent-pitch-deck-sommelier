services:
  backend:
    restart: unless-stopped
    env_file: backend/.env.backend
    build:
      context: backend
      dockerfile: Dockerfile
    expose:
      - 8000
    ports:
      - "8000:8000"

  frontend:
    restart: unless-stopped
    env_file: frontend/.env.frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"