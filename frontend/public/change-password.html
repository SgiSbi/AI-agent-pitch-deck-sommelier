<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Смена пароля после OTP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="top-nav"></div>
  <main class="main-content">
    <div class="container">
      <section class="card">
        <h2>Смена пароля</h2>
        <p class="muted">Для завершения входа по OTP задайте новый пароль.</p>
        <form id="otp-password-form">
          <div class="form-group"><input type="password" id="otp-new-password" placeholder="Новый пароль" required /></div>
          <div class="form-group"><input type="password" id="otp-new-password-repeat" placeholder="Повторите новый пароль" required /></div>
          <button type="submit" class="btn btn-primary">Сохранить пароль</button>
        </form>
        <div id="otp-password-success" class="info-box hidden"></div>
        <div id="otp-password-error" class="error hidden"></div>
      </section>
    </div>
  </main>
  <script src="common.js"></script>
  <script src="change-password.js"></script>
</body>
</html>
