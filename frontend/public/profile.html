    <section class="card">
      <h2>Смена пароля</h2>
      <form id="password-form">
        <div class="form-group"><input type="password" id="old-password" placeholder="Старый пароль" required /></div>
        <div class="form-group"><input type="password" id="new-password" placeholder="Новый пароль" required /></div>
        <div class="form-group"><input type="password" id="new-password-repeat" placeholder="Повторите новый пароль" required /></div>
        <button type="submit" class="btn btn-primary">Сменить пароль</button>
      </form>
      <div id="password-success" class="info-box hidden"></div>
      <div id="password-error" class="error hidden"></div>
